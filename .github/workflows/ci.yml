name: Validate backend and client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - name: Every RPC loads game content in a fresh Nakama VM
        run: node --test tests/*.test.cjs
        working-directory: server
        env:
          COLD_CONTENT: "1"
      - run: node scripts/build-life-world.cjs --check
      - run: node scripts/build-game-content.cjs --check
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: node scripts/smoke.mjs
      - run: node scripts/social-smoke.mjs
      - run: node scripts/inventory-smoke.mjs
      - name: Life activities against Nakama and PostgreSQL
        run: node scripts/life-smoke.mjs
      - name: Player forms and contracts against Nakama and PostgreSQL
        run: node scripts/spirit-contract-smoke.mjs
      - name: Nội Giới power system against Nakama and PostgreSQL
        run: node scripts/inner-world-smoke.mjs
      - name: Install Godot for live adapter test
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Test spirit gameplay and Godot REST adapter
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --editor --quit 2>&1 | tee /tmp/spirit-import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/spirit-import.log
          timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/spirit_gameplay_smoke.gd
          timeout 120 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/spirit_api_live_smoke.gd
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Validate backend map manifest
        run: node scripts/build-life-world.cjs --check
      - name: Static scene and asset audit
        run: |
          node scripts/check-localization.cjs
          node scripts/check-png-integrity.cjs
          node scripts/check-pixel-scenes.cjs
