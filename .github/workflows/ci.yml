name: Validate backend and client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: node scripts/smoke.mjs
      - run: node scripts/social-smoke.mjs
      - run: node scripts/inventory-smoke.mjs
      - name: Install Godot for live adapter test
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Test Godot adapter against Nakama
        if: ${{ hashFiles('client/tests/social_smoke.gd') != '' }}
        run: |
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --editor --quit
          timeout 120 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/social_smoke.gd
      - name: Test inventory panel against Nakama
        if: ${{ hashFiles('client/tests/inventory_smoke.gd') != '' }}
        run: timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/inventory_smoke.gd
      - name: Test sparring and solo PvE against Nakama
        if: ${{ hashFiles('client/tests/combat_smoke.gd') != '' }}
        run: timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/combat_smoke.gd
      - name: Test Sơn Trư PvE encounter against Nakama
        if: ${{ hashFiles('client/tests/pve_son_tru_smoke.gd') != '' }}
        run: timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/pve_son_tru_smoke.gd
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: ["4.6.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Static scene and asset audit
        run: |
          node scripts/check-localization.cjs
          node scripts/check-png-integrity.cjs
          node scripts/check-pixel-scenes.cjs
          node scripts/check-layered-map.cjs
          node scripts/check-world-map-blockouts.cjs
          node scripts/check-lang-que.cjs
          node scripts/check-lang-que-moi.cjs
      - name: Install Godot
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/engine
      - name: Import and run prototype
        run: |
          /tmp/godot/engine --headless --path client --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/import.log
          /tmp/godot/engine --headless --path client --quit-after 60 -- --no-auto-connect 2>&1 | tee /tmp/run.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/run.log
      - name: Real Godot 4.6 layered scene smoke
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/layered_map_smoke.gd 2>&1 | tee /tmp/map-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/map-smoke.log
      - name: First village interaction and physical route smoke
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/lang_que_smoke.gd 2>&1 | tee /tmp/lang-que-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/lang-que-smoke.log
      - name: First village neighbor preview round trips
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/lang_que_travel_smoke.gd 2>&1 | tee /tmp/lang-que-travel.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/lang-que-travel.log
      - name: New village interaction and physical route smoke
        run: |
          set -o pipefail
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/lang_que_moi_smoke.gd 2>&1 | tee /tmp/new-village-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/new-village-smoke.log
      - name: New village neighbor round trips
        run: |
          set -o pipefail
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/lang_que_moi_travel_smoke.gd 2>&1 | tee /tmp/new-village-travel.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/new-village-travel.log
      - name: Capture new village for visual review
        run: |
          set -o pipefail
          mkdir -p /tmp/tutien-previews
          timeout 120 xvfb-run -a -s '-screen 0 4096x3072x24' /tmp/godot/engine --audio-driver Dummy --path client --script res://tests/lang_que_moi_capture.gd 2>&1 | tee /tmp/new-village-capture.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/new-village-capture.log
      - name: Capture first village for visual review
        run: |
          mkdir -p /tmp/tutien-previews
          timeout 120 xvfb-run -a -s '-screen 0 4096x3072x24' /tmp/godot/engine --audio-driver Dummy --path client --script res://tests/lang_que_capture.gd 2>&1 | tee /tmp/lang-que-capture.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/lang-que-capture.log
      - name: World map terrain blockout smoke
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/world_map_blockout_smoke.gd 2>&1 | tee /tmp/world-map-smoke.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/world-map-smoke.log
      - name: Capture world map terrain blockouts for visual review
        run: |
          mkdir -p /tmp/tutien-previews
          timeout 120 xvfb-run -a /tmp/godot/engine --audio-driver Dummy --path client --script res://tests/world_map_blockout_capture.gd 2>&1 | tee /tmp/world-map-capture.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/world-map-capture.log
      - name: Validate pedestrian routes to houses, garden and bridge
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/layered_route_smoke.gd 2>&1 | tee /tmp/village-routes.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/village-routes.log
      - name: Offline presentation interaction smoke
        if: ${{ hashFiles('client/tests/presentation_smoke.gd') != '' }}
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/presentation_smoke.gd -- --no-auto-connect 2>&1 | tee /tmp/presentation.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/presentation.log
      - name: Offline Vietnamese and English localization smoke
        if: ${{ hashFiles('client/tests/localization_smoke.gd') != '' }}
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/localization_smoke.gd -- --no-auto-connect 2>&1 | tee /tmp/localization.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/localization.log
      - name: Capture actual M1 viewport for visual review
        run: |
          mkdir -p /tmp/tutien-previews
          timeout 90 xvfb-run -a /tmp/godot/engine --audio-driver Dummy --path client --script res://tests/layered_map_capture.gd 2>&1 | tee /tmp/map-capture.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load|ERROR:' /tmp/map-capture.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-layout-previews
          path: /tmp/tutien-previews/*.png
          if-no-files-found: warn
