name: Validate backend and client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: node scripts/smoke.mjs
      - run: node scripts/social-smoke.mjs
      - run: node scripts/inventory-smoke.mjs
      - name: Install Godot for live adapter test
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.1-stable_linux.x86_64
      - name: Test Godot adapter against Nakama
        run: |
          /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --editor --quit
          timeout 120 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/social_smoke.gd
      - name: Test inventory panel against Nakama
        run: timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/inventory_smoke.gd
      - name: Test sparring and solo PvE against Nakama
        run: timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/combat_smoke.gd
      - name: Test Sơn Trư PvE encounter against Nakama
        run: timeout 90 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/pve_son_tru_smoke.gd
      - name: Test online map travel, field gates and farming
        run: timeout 120 /tmp/godot/Godot_v4.6.1-stable_linux.x86_64 --headless --path client --script res://tests/world_field_smoke.gd
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        godot: ["4.6.1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Static scene and asset audit
        run: |
          node scripts/check-localization.cjs
          node scripts/check-png-integrity.cjs
          node scripts/check-pixel-scenes.cjs
      - name: Install Godot
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          ln -s "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /tmp/godot/engine
      - name: Import and run prototype
        run: |
          /tmp/godot/engine --headless --path client --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/import.log
          /tmp/godot/engine --headless --path client --quit-after 60 -- --no-auto-connect 2>&1 | tee /tmp/run.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/run.log
      - name: Offline presentation interaction smoke
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/presentation_smoke.gd -- --no-auto-connect 2>&1 | tee /tmp/presentation.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/presentation.log
      - name: Offline Vietnamese and English localization smoke
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/localization_smoke.gd -- --no-auto-connect 2>&1 | tee /tmp/localization.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/localization.log
      - name: Offline world weather smoke
        run: |
          timeout 90 /tmp/godot/engine --headless --path client --script res://tests/world_weather_smoke.gd -- --no-auto-connect 2>&1 | tee /tmp/weather.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/weather.log
      - name: Capture actual Godot layout on desktop and touch
        run: |
          mkdir -p /tmp/tutien-previews
          timeout 90 xvfb-run -a /tmp/godot/engine --path client --script res://tests/presentation_smoke.gd -- --no-auto-connect --capture-dir=/tmp/tutien-previews
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-layout-previews
          path: /tmp/tutien-previews/*.png
          if-no-files-found: warn
