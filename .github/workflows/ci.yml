name: Validate base
on: [push, pull_request]
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: node scripts/smoke.mjs
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and run prototype
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path client --editor --quit 2>&1 | tee /tmp/import.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/import.log
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path client --quit-after 60 2>&1 | tee /tmp/run.log
          ! grep -E 'SCRIPT ERROR|Parse Error|Failed to load' /tmp/run.log
